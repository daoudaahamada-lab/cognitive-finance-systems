<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu des boss</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root { --night: #0c111e; --slab: #141b2d; --slab-2: #1c2541; --line: #2b3657; --ink: #e8ecf6; --muted: #9aa5c3; --lamp: #f3b841; --ok: #57c48f; --bad: #ef6b5c; --toxic: #62f0a6; --rage: #ff4f9a; --glitch: #b38cff; color-scheme: dark; }
body { margin: 0; background: var(--night); color: var(--ink); font: 14px "Source Sans 3", sans-serif; padding: 14px; }
h2 { font: 800 22px "Big Shoulders Display", sans-serif; text-transform: uppercase; margin: 14px 0 6px; }
.boss { display: grid; grid-template-columns: 1144px 760px; gap: 10px; align-items: start; }
.states { display: grid; grid-template-columns: repeat(4, 280px); gap: 8px; }
figure { margin: 0; }
canvas.st { width: 280px; height: 230px; background: linear-gradient(#0a0f1f, #1c2647); border: 1px solid var(--line); display: block; }
canvas.arena { width: 760px; height: 600px; border: 1px solid var(--line); display: block; }
figcaption { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="out"></div>
<script>
window.__LEVELS__ = [];
(() => {
/*__JS__*/
/* ---- Page d'aperçu ----
   Chaque boss est montré dans 8 états, puis dans l'arène (décor, taille réelle, projectile, zones de touche).
   Ajouter #f=0.4 à l'adresse fige les boucles (riposte, action spéciale, entrée, mort) à 40 % de leur durée. */
const freeze = (() => { const m = location.hash.match(/f=([\d.]+)/); return m ? clamp(Number(m[1]), 0, 1) : null; })();
const guides = !/noguides/.test(location.hash);
const STATES = [
  { label: "repos (les yeux suivent la cible)", s: {} },
  { label: "coup reçu : flash, yeux plissés, dmg 1", s: { flash: 0.8, squint: 1, cracks: 3, dmg: 1, hpFrac: 0.7 } },
  { label: "riposte (b.atk en boucle)", s: { atkLoop: true } },
  { label: "rage : dmg 2, 40 % de vie", s: { rage: true, rageT: 1, hpFrac: 0.4, dmg: 2, cracks: 8, mech: { parse: { bad: true, k: 0.5 }, shield: { up: false, streak: 0 } } } },
  { label: "vie basse : dmg 3, étourdi", s: { rage: true, rageT: 1, hpFrac: 0.08, dmg: 3, cracks: 16, stun: 1 } },
  { label: "action spéciale (b.cast) + parole", s: { castLoop: true } },
  { label: "entrée en scène (b.enter 0→1)", s: { enterLoop: true } },
  { label: "mort (b.dying 0→1)", s: { dieLoop: true, rage: true, rageT: 1, hpFrac: 0, dmg: 3, cracks: 16 } }
];
function makeB(B, s) {
  const b = {
    t: 0, time: 0, hpFrac: s.hpFrac ?? 1, flash: s.flash || 0, squint: s.squint || 0, rage: !!s.rage, rageT: s.rageT || 0,
    atk: -1, cast: -1, stun: s.stun || 0, aiming: true, cracks: [], phase: 0, own: {},
    enter: 1, dying: -1, dmg: s.dmg || 0, look: { x: -1, y: 0 }, threat: 0, gloat: 0, talk: 0, beat: 0, isMirage: false,
    mech: Object.assign({ heads: { count: 3 }, shield: { up: true, streak: 1 }, fog: { shown: 0.5, level: 0.5 }, parse: { bad: false, k: 0 }, incidents: { hook: false, list: [] }, turrets: { list: [] }, tokens: {}, injection: {}, shuffle: {} }, s.mech || {})
  };
  for (let k = 0; k < (s.cracks || 0); k++) {
    let x = rand(-B.hit.rx * 0.7, B.hit.rx * 0.7), y = rand(-B.hit.ry * 0.6, B.hit.ry * 0.6), a = rand(0, 6.28);
    const pts = [[x, y]];
    for (let i = 0; i < 3; i++) { a += rand(-0.7, 0.7); x += Math.cos(a) * 14; y += Math.sin(a) * 14; pts.push([x, y]); }
    b.cracks.push(pts);
  }
  if (B.init) B.init(b);
  return b;
}
function tick(b, s, B, dt, id) {
  b.t += dt; b.time += dt;
  b.beat = Math.max(0, 1 - ((b.time * 100 / 60) % 1) * 2.4);
  b.look = { x: Math.cos(b.time * 0.9) * 0.9 - 0.3, y: Math.sin(b.time * 0.9) * 0.6 };
  const loop = (dur, hold) => (freeze != null ? freeze : Math.min(1, (b.time % (dur + hold)) / dur));
  if (s.atkLoop) { const u = freeze != null ? freeze : (b.time % 1.7) / ATK_END; b.atk = u <= 1 ? u * ATK_END : -1; }
  if (s.castLoop) { const u = freeze != null ? freeze : (b.time % 1.6) / 0.9; b.cast = u <= 1 ? u * 0.9 : -1; b.talk = 0.5 + 0.5 * Math.sin(b.time * 14); }
  if (s.enterLoop) b.enter = loop(T_ENTER, 0.9);
  if (s.dieLoop) b.dying = loop(T_DIE, 0.7);
  if (id === "10") { b.phase = Math.floor(b.time / 3) % 3; }
  if (B.update) B.update(b, dt);
}
function drawGuides(c, B, b) {
  if (!guides) return;
  c.save();
  c.setLineDash([4, 4]); c.strokeStyle = "rgba(243,184,65,0.5)"; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(0, 0, B.hit.rx, B.hit.ry, 0, 0, Math.PI * 2); c.stroke();
  const ws = B.weakSpot ? B.weakSpot(b) : { x: 0, y: 0 };
  c.strokeStyle = "rgba(239,107,92,0.9)"; c.beginPath(); c.arc(ws.x, ws.y, B.hit.coreR, 0, Math.PI * 2); c.stroke();
  c.setLineDash([]); c.fillStyle = "#ef6b5c"; c.beginPath(); c.arc(B.attackFrom.x, B.attackFrom.y, 5, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(232,236,246,0.5)"; c.beginPath(); c.moveTo(-20, -B.top); c.lineTo(20, -B.top); c.stroke();
  if (B.headLocal) for (let i = 0; i < 3; i++) { const p = B.headLocal(i, 3, b); c.strokeStyle = "rgba(87,196,143,0.9)"; c.beginPath(); c.arc(p.x, p.y, 16, 0, Math.PI * 2); c.stroke(); }
  c.restore();
}
function fail(c, e) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = "#ef6b5c"; c.font = "16px monospace"; c.fillText(String(e.message).slice(0, 70), 10, 30); console.error(e); }

const out = document.getElementById("out"), cells = [], arenas = [];
const ids = Object.keys(BOSSES).filter((k) => k !== "dummy").sort((a, b) => a - b);
for (const id of ids) {
  const B = BOSSES[id];
  const h = document.createElement("h2"); h.textContent = "Boss " + id; out.appendChild(h);
  const wrap = document.createElement("div"); wrap.className = "boss"; out.appendChild(wrap);
  const states = document.createElement("div"); states.className = "states"; wrap.appendChild(states);
  for (const st of STATES) {
    const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
    cv.className = "st"; cv.width = 560; cv.height = 460; cap.textContent = st.label;
    fig.appendChild(cv); fig.appendChild(cap); states.appendChild(fig);
    cells.push({ cv, B, b: makeB(B, st.s), st, id });
  }
  const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
  cv.className = "arena"; cv.width = 760; cv.height = 600; cap.textContent = "arène : décor (backdrop + ambient), taille réelle ×" + ARENA_SCALE + ", déplacement (motion), projectile (shot)";
  fig.appendChild(cv); fig.appendChild(cap); wrap.appendChild(fig);
  const env = { W: 760, H: 600, groundY: 536, n: Number(id), rnd: seeded(1000 + Number(id)), time: 0 };
  const bg = document.createElement("canvas"); bg.width = 760; bg.height = 600;
  try { paintBackground(bg.getContext("2d"), env, B); } catch (e) { console.error(e); }
  arenas.push({ cv, bg, B, b: makeB(B, {}), env, id });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const cell of cells) {
    const { cv, B, b, st, id } = cell, c = cv.getContext("2d");
    tick(b, st.s, B, dt, id);
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    c.setTransform(1, 0, 0, 1, 280, 250);
    c.save(); try { B.draw(c, b); } catch (e) { c.restore(); fail(c, e); continue; } c.restore();
    drawGuides(c, B, b);
  }
  for (const a of arenas) {
    const { cv, bg, B, b, env, id } = a, c = cv.getContext("2d");
    env.time += dt;
    tick(b, { atkLoop: false }, B, dt, id);
    const cyc = b.time % 3.6, u = freeze != null ? freeze : (cyc - 2.4) / ATK_END;
    b.atk = (freeze != null || cyc >= 2.4) && u <= 1 ? u * ATK_END : -1;
    b.gloat = Math.max(0, 1 - Math.abs(cyc - 0.4) * 2);
    c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(bg, 0, 0);
    if (B.ambient) { c.save(); try { B.ambient(c, env, b); } catch (e) { console.error(e); } c.restore(); }
    let off = { x: Math.sin(b.t * 0.45) * 10, y: Math.sin(b.t * 1.7) * 14 };
    if (B.motion) try { off = B.motion(b, env) || off; } catch (e) { console.error(e); }
    const bx = env.W * 0.71 + clamp(off.x, -90, 40), by = env.groundY - 312 + clamp(off.y, -80, 70);
    c.save(); c.translate(bx, by); c.scale(ARENA_SCALE, ARENA_SCALE);
    try { B.draw(c, b); } catch (e) { c.restore(); fail(c, e); continue; }
    drawGuides(c, B, b); c.restore();
    // joueur (repère de taille)
    c.fillStyle = "#33406b"; c.fillRect(85, env.groundY - 113, 42, 65); c.fillStyle = "#eec7a0"; c.beginPath(); c.arc(109, env.groundY - 131, 17, 0, 6.3); c.fill(); c.fillStyle = "#222b47"; c.fillRect(91, env.groundY - 52, 30, 52);
    // projectile de riposte
    if (b.atk >= ATK_WIND) {
      const k = clamp((b.atk - ATK_WIND) / 0.5, 0, 1), sx = bx + B.attackFrom.x * ARENA_SCALE, sy = by + B.attackFrom.y * ARENA_SCALE, tx = 110, ty = env.groundY - 92;
      const pos = (q) => ({ x: lerp(sx, tx, q), y: lerp(sy, ty, q) - Math.sin(q * Math.PI) * 40 });
      const p = pos(k), p2 = pos(Math.min(1, k + 0.02));
      c.save(); c.translate(p.x, p.y);
      const shot = B.shot;
      if (shot && shot.draw) { c.rotate(shot.spin ? b.time * shot.spin : Math.atan2(p2.y - p.y, p2.x - p.x)); try { shot.draw(c, { t: k * 0.5, k, rage: b.rage }); } catch (e) { console.error(e); } }
      else { c.fillStyle = "#f8fbff"; c.beginPath(); c.arc(0, 0, 7, 0, 6.3); c.fill(); }
      c.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
